<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Guidance Chatbot</title>
  <style>
    /* Chatbot Icon Style */
    #chatbot-icon {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #2b78e4;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      z-index: 999;
    }

    /* Chatbox Container */
    #chatbox-container {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 350px;
      max-height: 500px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 999;
    }

    /* Chat Messages Area */
    #chatbox-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    /* Styling for User and Bot Messages */
    #chatbox-messages div {
      margin-bottom: 10px;
    }
    .user { text-align: right; color: #2b78e4; }
    .bot { text-align: left; color: #333; }

    /* Input Area */
    .chatbox-input {
      display: flex;
      border-top: 1px solid #ccc;
    }

    .chatbox-input input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .chatbox-input button {
      padding: 10px 15px;
      border: none;
      background: #2b78e4;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Chatbot Icon -->
  <div id="chatbot-icon" onclick="toggleChatbot()">💬</div>

  <!-- Chatbox Container -->
  <div id="chatbox-container">
    <div id="chatbox-messages"></div>
    <div class="chatbox-input">
      <input type="text" id="chatbot-input" placeholder="Ask your career question..." />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <script src="chatbot.js"></script>

</body>
</html>
